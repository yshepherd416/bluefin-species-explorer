<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluefin Species Explorer</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Bluefin Species Explorer</h1>
        <p>Explore marine species and their habitats.</p>
    </header>

    <main>

        <section>
            <h2>Search Species</h2>

            <label for="species-search">Search:</label>
            <input
                type="search"
                id="species-search"
                placeholder="Enter a species name"
            >
        </section>

        <section>
            <h2>Species</h2>

            <div id="species-list">
                <!-- Species cards will be created here later -->
            </div>
        </section>

        <section>
            <h2>Species Map</h2>

            <div id="species-map">
                <!-- Map will go here later -->
            </div>
        </section>

    </main>

    <footer>
        <p>Bluefin Species Explorer</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
